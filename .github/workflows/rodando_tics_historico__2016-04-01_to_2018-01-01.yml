name: Rodando Avaliação Tics Historicos 2016-04-01_to_2018-01-01
on:
    workflow_run:
            workflows: ["Rodando Avaliação Tics Historicos 2016-01-01_to_2017-10-01"]
            types:
                    - completed
    workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copia os arquivos do repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PORTFOLIO_OPTIMIZER }}

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar o uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Criar ambiente virtual
        run: |
          uv venv

      - name: Instalar as bibliotecas
        run: |
          source .venv/bin/activate
          make uv_install

      - name: Rodando coleta
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYDANTIC_API_KEY: ${{ secrets.PYDANTIC_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          PHOENIX_API_KEY: ${{ secrets.PHOENIX_API_KEY }}
          PHOENIX_COLLECTOR_ENDPOINT: ${{ secrets.PHOENIX_COLLECTOR_ENDPOINT }}
        run: |
          cd ./codigos_rodando/rodando_carteira_historica
          pwd
          uv run rodando_agente_avaliador_tics_historico_2016-04-01_to_2018-01-01.py
      - name : Configure Git
        run: |
            git config --global user.email "sehnemjeferson@gmail.com"
            git config --global user.name "Jeferson Sehnem"    
      - name: Commit and push changes
        env:
            GITHUB_TOKEN: ${{ secrets.AGENT_PORTFOLIO_OPTIMIZER }}
        run: |
              git add .
              if git diff-index --quiet HEAD; then
                  echo "No changes to commit"
                  exit 0
              fi
              git commit -m "Avaliação TICS: $(date +'%Y-%m-%d')"
              git push https://Jeferson100:${{ secrets.AGENT_PORTFOLIO_OPTIMIZER }}@github.com/Jeferson100/Agent-Portfolio-Optimizer.git HEAD:main
