[project]
name = "agent-portfolio-optimizer"
version = "0.0.1"
description = "An intelligent multi-agent system for portfolio optimization using LangGraph and LLMs to analyze stocks and determine optimal asset allocation weights."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix>=12.25.1",
    "arize-phoenix-otel>=0.14.0",
    "bs4>=0.0.2",
    "cerebras-cloud-sdk>=1.59.0",
    "finta>=1.3",
    "groq>=0.34.1",
    "ipeadatapy>=0.1.9",
    "ipykernel>=7.1.0",
    "langchain==1.0.3",
    "langchain-community>=0.4.1",
    "langchain-core==1.0.5",
    "langchain-docling>=2.0.0",
    "langchain-google-genai>=3.0.3",
    "langchain-groq>=1.0.1",
    "langchain-nvidia-ai-endpoints>=1.0.0",
    "langgraph==1.0.3",
    "matplotlib>=3.10.7",
    "openai>=2.12.0",
    "openinference-instrumentation-langchain>=0.1.56",
    "openinference-instrumentation-groq>=0.1.6",
    "pandas>=2.3.3",
    "pydantic-ai>=1.18.0",
    "python-bcb>=0.3.3",
    "retrying>=1.4.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "selenium>=4.36.0",
    "sidrapy>=0.1.4",
    "tabulate>=0.9.0",
    "tavily-python>=0.7.13",
    "tdqm>=0.0.1",
    "tqdm>=4.67.1",
    "unidecode>=1.4.0",
    "webdriver-manager>=4.0.2",
    "yfinance>=0.2.66",
]

[project.optional-dependencies]
dev = [
    "mypy==1.15.0",
    "ruff==0.9.6",
    "pytest==7.1.3",
    "pytest-cov==4.0.0",
    "pytest-asyncio==0.21.1",
    "black==25.1.0",
    "pylint==4.0.2",
    "pyright>=1.1.407",
    "pyrefly>=0.46.0"
]

[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["portfolio_optimizer"]
[tool.setuptools.package-dir]
"portfolio_optimizer" = "src/portfolio_optimizer"

[tool.ruff]
select = ["E", "F", "B"]
ignore = []
line-length = 88
target-version = "py310"

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true
max-doc-length = 100
max-line-length = 500
#ignore-one-line-docstrings = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=agente_investimento"

[tool.pyrefly]
permissive-ignores = true
use-untyped-imports = true

[tool.mypy]
python_version = "3.12"  
mypy_path = "src"
packages = ["portfolio_optimizer"]
explicit_package_bases = true
namespace_packages = true

# Opções adicionais recomendadas
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true




